[package]
name = "anysdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "deny"

[features]
default = []
alpaca = ["dep:alpaca_sdk"]
alpaca-stream = ["dep:alpaca_stream", "alpaca"]
finviz = ["dep:finviz_sdk"]
full = ["alpaca", "alpaca-stream", "finviz"]

[dependencies]
utils.workspace = true
alpaca_sdk = { workspace = true, optional = true }
alpaca_stream = { workspace = true, optional = true }
finviz_sdk = { workspace = true, optional = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/utils",
    "crates/alpaca_sdk",
    "crates/alpaca_stream",
    "crates/finviz_sdk",
    "crates/test",
]
resolver = "2"

[workspace.dependencies]
# —— 仅收录被多个 crate 共用的依赖;单一 crate 专用的依赖放在各自 Cargo.toml ——
utils = { path = "crates/utils" }
alpaca_sdk = { path = "crates/alpaca_sdk" }
alpaca_stream = { path = "crates/alpaca_stream" }
finviz_sdk = { path = "crates/finviz_sdk" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
simd-json = "0.13"              # utils, alpaca_sdk, alpaca_stream
urlencoding = "2.1.3"           # utils, finviz_sdk
chrono = { version = "0.4.45", features = ["serde"] }   # alpaca_sdk, alpaca_stream
futures = "0.3.34"              # alpaca_stream, test
tokio = { version = "1", features = ["full"] }   # alpaca_stream, test
